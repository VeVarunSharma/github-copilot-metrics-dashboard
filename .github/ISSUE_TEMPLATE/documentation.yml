name: Documentation gap
description: Report missing, confusing, or stale Copilot Metrics Dashboard documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: dropdown
    id: area
    attributes:
      label: Documentation area
      options:
        - README / quickstart
        - Demo mode
        - Real-data mode
        - Privacy / security
        - Specs / Constitution
        - Architecture
        - Collector / ingestion
        - Database / migrations
        - UI / dashboard
        - Other
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What is missing or unclear?
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Current location
      description: Link to the file, section, or page if known.
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Share the wording, example, command, or screenshot you expected.
  - type: dropdown
    id: setup-path
    attributes:
      label: Affected setup path
      options:
        - Demo mode
        - Real-data mode
        - Both
        - Not setup-related
        - Not sure
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included secrets, credentials, raw customer data, or sensitive screenshots.
          required: true
