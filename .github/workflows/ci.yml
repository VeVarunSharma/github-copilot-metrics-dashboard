name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  bicep-validate:
    name: Validate Bicep templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Bicep templates
        run: |
          az bicep install
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
          az bicep build --file infra/main.bicep --stdout > /dev/null

  docker-build-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web image
        run: docker build --file infra/docker/Dockerfile.web --tag ghcp-dashboard-web:ci .

      - name: Build collector image
        run: docker build --file infra/docker/Dockerfile.collector --tag ghcp-dashboard-collector:ci .

  build-test:
    name: Build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghcp
          POSTGRES_PASSWORD: ghcp
          POSTGRES_DB: ghcp_metrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghcp -d ghcp_metrics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Wait for PostgreSQL
        run: |
          for _ in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' '${{ job.services.postgres.id }}')
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs '${{ job.services.postgres.id }}'
          exit 1

      - name: Install dependencies
        # Intentional: this may fail on the first commit before pnpm-lock.yaml exists.
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm --filter @ghcp-dash/value build && pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify database migrations
        run: pnpm smoke:migrate
        env:
          DATABASE_URL: postgres://ghcp:ghcp@localhost:5432/ghcp_metrics

      - name: Collector concurrency test (DB-backed)
        run: pnpm --filter @ghcp-dash/collector test
        env:
          DATABASE_URL: postgres://ghcp:ghcp@localhost:5432/ghcp_metrics

      - name: Smoke collector configuration
        run: pnpm smoke:collector-config
        env:
          DATABASE_URL: postgres://ghcp:ghcp@localhost:5432/ghcp_metrics
          GITHUB_TOKEN: ci-placeholder-token
          GITHUB_ORGS: demo-org
          GITHUB_API_BASE_URL: https://api.github.com

      - name: Smoke demo seed
        run: pnpm db:seed:demo && pnpm smoke:demo:verify
        env:
          DATABASE_URL: postgres://ghcp:ghcp@localhost:5432/ghcp_metrics
