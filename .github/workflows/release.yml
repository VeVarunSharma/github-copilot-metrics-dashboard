name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate-build-publish:
    name: Validate, build, and publish release
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghcp
          POSTGRES_PASSWORD: ghcp
          POSTGRES_DB: ghcp_metrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghcp -d ghcp_metrics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag and changelog entry
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v0.1.0 or v0.1.0-beta.1."
            exit 1
          fi
          if ! grep -Eq "^## \[?${GITHUB_REF_NAME}\]?([[:space:]]|-|$)" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a ${GITHUB_REF_NAME} entry."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: pnpm

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' '${{ job.services.postgres.id }}')
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs '${{ job.services.postgres.id }}'
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify database migrations
        run: pnpm smoke:migrate
        env:
          DATABASE_URL: postgres://ghcp:ghcp@localhost:5432/ghcp_metrics

      - name: Smoke collector configuration
        run: pnpm smoke:collector-config
        env:
          DATABASE_URL: postgres://ghcp:ghcp@localhost:5432/ghcp_metrics
          GITHUB_TOKEN: ci-placeholder-token
          GITHUB_ORGS: demo-org
          GITHUB_API_BASE_URL: https://api.github.com

      - name: Smoke demo seed
        run: pnpm db:seed:demo && pnpm smoke:demo:verify
        env:
          DATABASE_URL: postgres://ghcp:ghcp@localhost:5432/ghcp_metrics

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: images
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "web=ghcr.io/${repo}-web" >> "$GITHUB_OUTPUT"
          echo "collector=ghcr.io/${repo}-collector" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        id: build_web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: |
            ${{ steps.images.outputs.web }}:${{ github.ref_name }}
            ${{ steps.images.outputs.web }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=@ghcp-dash/web
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push collector image
        id: build_collector
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.collector
          push: true
          tags: |
            ${{ steps.images.outputs.collector }}:${{ github.ref_name }}
            ${{ steps.images.outputs.collector }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=@ghcp-dash/collector
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Prepare release notes
        env:
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          WEB_DIGEST: ${{ steps.build_web.outputs.digest }}
          COLLECTOR_IMAGE: ${{ steps.images.outputs.collector }}
          COLLECTOR_DIGEST: ${{ steps.build_collector.outputs.digest }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          body: list[str] = []
          in_section = False

          for line in changelog:
            if line.startswith("## "):
              heading = line[3:].strip()
              normalized = heading.split(" - ", 1)[0].strip().strip("[]")
              if in_section:
                break
              if normalized == tag:
                in_section = True
                continue
            elif in_section:
              body.append(line)

          notes = "\n".join(body).strip()
          if not notes:
            print(f"Could not find release notes for {tag} in CHANGELOG.md", file=sys.stderr)
            sys.exit(1)

          notes += "\n\n### Published image digests\n\n"
          notes += f"- `{os.environ['WEB_IMAGE']}:{tag}` → `{os.environ['WEB_DIGEST']}`\n"
          notes += f"- `{os.environ['COLLECTOR_IMAGE']}:{tag}` → `{os.environ['COLLECTOR_DIGEST']}`\n"
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
